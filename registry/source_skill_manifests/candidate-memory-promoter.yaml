id: candidate-memory-promoter
version: 0.1.0
status: draft
owner: framework owner
category: memory
priority: P0
purpose: Decide whether a trace-derived observation, claim, or procedure may enter
  a wider memory scope.
activation:
  when:
  - completed run proposes memory
  not_when:
  - run unverified/disputed/policy-violating
inputs:
  required:
  - candidate
  - source evidence
  - verification
  - scope
  - contradictions
  - owner
  - expiry
outputs:
  produces: &id001
  - promote/reject/quarantine
  - target scope
  - requirements
  - supersession links
effects:
  reads:
  - registry/state/evidence as scoped
  writes:
  - trace and structured result; memory is candidate-only
  network: none by default; adapters declare destinations
  side_effect_class: read_or_control_plane unless composed tool differs
permissions:
- registry:read
- trace:write
- memory-candidate:read
- memory-promotion:propose
dependencies:
- intelligent system memory governance
- outcome verifier
- knowledge graph
- promotion
risk:
  tier: R2
  approval: deployment approval; runtime approval follows composed effects
budgets:
  timeout_seconds: 120
  max_retries: 1
  max_tool_calls: 12
idempotency:
  required_for_side_effects: true
postconditions: *id001
memory_policy:
  read: scoped
  write: candidate_only
tests:
- tests/test_cases.yaml
metrics:
- correction rate
- duplicates
- stale claims
provenance:
  generated: '2026-08-01'
  source_ids:
  - karpathy-llm-wiki
  - llm-wiki-v2
  - memharness
