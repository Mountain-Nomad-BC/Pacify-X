id: benchmark-domain-adapter
version: 0.1.0
status: draft
owner: framework owner
category: research-ops
priority: P1
purpose: Translate an academic benchmark into independent framework domain cases, outcomes, risks,
  and evidence requirements.
activation:
  when:
  - claim needs validation on diagnostics/transcripts/RAG/code/operations
  not_when:
  - original benchmark already matches domain/data policy
inputs:
  required:
  - paper benchmark
  - domain taxonomy
  - historical cases
  - postconditions
  - risk tiers
outputs:
  produces: &id001
  - domain benchmark
  - case set
  - rubric
  - baseline
  - acceptance threshold
effects:
  reads:
  - registry/state/evidence as scoped
  writes:
  - trace and structured result; memory is candidate-only
  network: none by default; adapters declare destinations
  side_effect_class: read_or_control_plane unless composed tool differs
permissions:
- registry:read
- trace:write
dependencies:
- active evaluation
- scenario audits
- certification
risk:
  tier: R1
  approval: deployment approval; runtime approval follows composed effects
budgets:
  timeout_seconds: 120
  max_retries: 1
  max_tool_calls: 12
idempotency:
  required_for_side_effects: true
postconditions: *id001
memory_policy:
  read: scoped
  write: candidate_only
tests:
- tests/test_cases.yaml
metrics:
- benchmark validity
- production correlation
provenance:
  generated: '2026-08-01'
  source_ids:
  - proeval
  - long-horizon-bench
