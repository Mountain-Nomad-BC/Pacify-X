id: bounded-workflow-topology-selector
version: 0.1.0
status: draft
owner: framework owner
category: advanced
priority: P3
purpose: Select among approved workflow templates based on complexity, novelty, risk,
  and evidence conflict.
activation:
  when:
  - multiple validated topologies exist
  not_when:
  - would invent arbitrary roles/links in production
inputs:
  required:
  - task class
  - risk
  - novelty
  - specialists
  - performance history
outputs:
  produces: &id001
  - template
  - roles
  - visibility
  - verification path
  - fallback
effects:
  reads:
  - registry/state/evidence as scoped
  writes:
  - trace and structured result; memory is candidate-only
  network: none by default; adapters declare destinations
  side_effect_class: read_or_control_plane unless composed tool differs
permissions:
- registry:read
- trace:write
dependencies:
- workflow router
- planner
- outcome verifier
risk:
  tier: R1
  approval: deployment approval; runtime approval follows composed effects
budgets:
  timeout_seconds: 120
  max_retries: 1
  max_tool_calls: 12
idempotency:
  required_for_side_effects: true
postconditions: *id001
memory_policy:
  read: scoped
  write: candidate_only
tests:
- tests/test_cases.yaml
metrics:
- success by topology
- cost vs baseline
- switches
provenance:
  generated: '2026-08-01'
  source_ids:
  - manta
