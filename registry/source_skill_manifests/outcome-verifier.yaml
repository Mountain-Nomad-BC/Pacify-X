id: outcome-verifier
version: 0.1.0
status: draft
owner: framework owner
category: assurance
priority: P0
purpose: Independently determine whether evidence, policy, and actual postconditions
  support the claimed result.
activation:
  when:
  - skill claims completion
  - consequential recommendation produced
  - memory candidate proposed
  not_when:
  - only executor conclusion is available without evidence
inputs:
  required:
  - original goal
  - approved plan
  - evidence
  - action trace
  - policy
  - postconditions
  - proposed result
outputs:
  produces: &id001
  - verification status
  - failed checks
  - warnings
  - required actions
  - approved evidence
effects:
  reads:
  - registry/state/evidence as scoped
  writes:
  - trace and structured result; memory is candidate-only
  network: none by default; adapters declare destinations
  side_effect_class: read_or_control_plane unless composed tool differs
permissions:
- registry:read
- trace:write
dependencies:
- outcome verifier
- intelligent system outcome monitor
- evidence store
- promotion gate
risk:
  tier: R2
  approval: deployment approval; runtime approval follows composed effects
budgets:
  timeout_seconds: 120
  max_retries: 1
  max_tool_calls: 12
idempotency:
  required_for_side_effects: true
postconditions: *id001
memory_policy:
  read: scoped
  write: candidate_only
tests:
- tests/test_cases.yaml
metrics:
- false pass
- false escalation
- human correction
- unsupported claims found
provenance:
  generated: '2026-08-01'
  source_ids:
  - audit-budget
  - nice-enterprise-agents
