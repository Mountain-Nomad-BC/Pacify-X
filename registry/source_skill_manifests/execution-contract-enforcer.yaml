id: execution-contract-enforcer
version: 0.1.0
status: draft
owner: framework owner
category: orchestration
priority: P0
purpose: Wrap every skill with validation, authorization, budget, idempotency, execution,
  verification, and trace controls.
activation:
  when:
  - any governed skill executes
  not_when:
  - never bypass in production
inputs:
  required:
  - execution envelope
  - manifest
  - identity
  - policy decision
  - approved context
outputs:
  produces: &id001
  - structured result
  - trace events
  - verification request
  - memory candidates
  - failure class
effects:
  reads:
  - registry/state/evidence as scoped
  writes:
  - trace and structured result; memory is candidate-only
  network: none by default; adapters declare destinations
  side_effect_class: read_or_control_plane unless composed tool differs
permissions:
- registry:read
- trace:write
dependencies:
- intelligent system turn orchestrator
- policy engine
- tool gateway
- verifier
- telemetry
risk:
  tier: R2
  approval: deployment approval; runtime approval follows composed effects
budgets:
  timeout_seconds: 120
  max_retries: 1
  max_tool_calls: 12
idempotency:
  required_for_side_effects: true
postconditions: *id001
memory_policy:
  read: scoped
  write: candidate_only
tests:
- tests/test_cases.yaml
metrics:
- schema failures
- duplicate effects prevented
- unclassified errors
- bypass attempts
provenance:
  generated: '2026-08-01'
  source_ids:
  - iii-agent-harness
  - iii-loop-engineering
  - langgraph-workflow-pathways
