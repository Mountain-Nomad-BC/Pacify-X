id: reasoning-utility-controller
version: 0.1.0
status: draft
owner: framework owner
category: evaluation
priority: P0
purpose: Decide whether another reasoning, retrieval, verification, or tool step has
  enough expected value.
activation:
  when:
  - loop may continue
  - budget/latency matters
  - verification repeats
  not_when:
  - mandatory safety check remains
inputs:
  required:
  - information gain
  - unresolved requirements
  - state change
  - repetition
  - cost
  - risk
  - budget
outputs:
  produces: &id001
  - continue/stop/escalate
  - utility
  - reason
  - next permitted action
effects:
  reads:
  - registry/state/evidence as scoped
  writes:
  - trace and structured result; memory is candidate-only
  network: none by default; adapters declare destinations
  side_effect_class: read_or_control_plane unless composed tool differs
permissions:
- registry:read
- trace:write
dependencies:
- budget controller
- tool-loop breaker
- planner
risk:
  tier: R2
  approval: deployment approval; runtime approval follows composed effects
budgets:
  timeout_seconds: 120
  max_retries: 1
  max_tool_calls: 12
idempotency:
  required_for_side_effects: true
postconditions: *id001
memory_policy:
  read: scoped
  write: candidate_only
tests:
- tests/test_cases.yaml
metrics:
- cost per outcome
- unnecessary calls
- premature stops
provenance:
  generated: '2026-08-01'
  source_ids:
  - overthinking
  - tool-loop-attacks
