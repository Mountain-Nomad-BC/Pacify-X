id: evidence-assembler
version: 0.1.0
status: draft
owner: framework owner
category: assurance
priority: P0
purpose: Build a typed evidence package distinguishing measurement, source text, tool
  output, inference, assumption, and precedent.
activation:
  when:
  - factual conclusion/diagnostic/verifier request produced
  not_when:
  - purely creative output
inputs:
  required:
  - claims
  - measurements
  - documents
  - tool results
  - memory precedents
  - timestamps
outputs:
  produces: &id001
  - claim-evidence graph
  - sufficiency
  - freshness warnings
  - unsupported claims
effects:
  reads:
  - registry/state/evidence as scoped
  writes:
  - trace and structured result; memory is candidate-only
  network: none by default; adapters declare destinations
  side_effect_class: read_or_control_plane unless composed tool differs
permissions:
- registry:read
- trace:write
dependencies:
- intelligent system retrieval/citation
- outcome verifier
- diagnostic reports
- knowledge graph
risk:
  tier: R2
  approval: deployment approval; runtime approval follows composed effects
budgets:
  timeout_seconds: 120
  max_retries: 1
  max_tool_calls: 12
idempotency:
  required_for_side_effects: true
postconditions: *id001
memory_policy:
  read: scoped
  write: candidate_only
tests:
- tests/test_cases.yaml
metrics:
- unsupported claims
- citation resolution
- human corrections
provenance:
  generated: '2026-08-01'
  source_ids:
  - karpathy-llm-wiki
  - memharness
