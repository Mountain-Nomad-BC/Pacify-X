id: skill-admission-controller
version: 0.1.0
status: draft
owner: framework owner
category: security
priority: P0
purpose: Control whether a skill may enter registry, sandbox, canary, or production.
activation:
  when:
  - skill imported/generated/modified/upgraded
  not_when:
  - never bypass production activation
inputs:
  required:
  - package
  - manifest
  - provenance
  - dependencies
  - permissions
  - tests
  - signatures
outputs:
  produces: &id001
  - admit/restrict/quarantine/reject
  - remediations
  - allowed environment
  - promotion state
effects:
  reads:
  - registry/state/evidence as scoped
  writes:
  - trace and structured result; memory is candidate-only
  network: none by default; adapters declare destinations
  side_effect_class: read_or_control_plane unless composed tool differs
permissions:
- registry:read
- trace:write
dependencies:
- intelligent system registry
- detonator
- permission diff
- CI/CD
risk:
  tier: R2
  approval: deployment approval; runtime approval follows composed effects
budgets:
  timeout_seconds: 120
  max_retries: 1
  max_tool_calls: 12
idempotency:
  required_for_side_effects: true
postconditions: *id001
memory_policy:
  read: scoped
  write: candidate_only
tests:
- tests/test_cases.yaml
metrics:
- malicious escapes
- false rejection
- admission time
provenance:
  generated: '2026-08-01'
  source_ids:
  - malicious-skills
  - skill-detonate
