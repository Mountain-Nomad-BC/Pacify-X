id: cross-paper-mechanism-fuser
version: 0.1.0
status: draft
owner: framework owner
category: research-ops
priority: P2
purpose: Combine compatible research primitives into a stronger subsystem while exposing
  conflicts.
activation:
  when:
  - mechanisms address adjacent workflow parts
  not_when:
  - complexity rises without measurable gain
inputs:
  required:
  - mechanism cards
  - assumptions
  - data flows
  - controls
  - architecture
outputs:
  produces: &id001
  - fused architecture
  - interaction risks
  - shared components
  - test matrix
  - phases
effects:
  reads:
  - registry/state/evidence as scoped
  writes:
  - trace and structured result; memory is candidate-only
  network: none by default; adapters declare destinations
  side_effect_class: read_or_control_plane unless composed tool differs
permissions:
- registry:read
- trace:write
dependencies:
- research registry
- decision log
risk:
  tier: R1
  approval: deployment approval; runtime approval follows composed effects
budgets:
  timeout_seconds: 120
  max_retries: 1
  max_tool_calls: 12
idempotency:
  required_for_side_effects: true
postconditions: *id001
memory_policy:
  read: scoped
  write: candidate_only
tests:
- tests/test_cases.yaml
metrics:
- combined lift
- complexity cost
- interaction failures
provenance:
  generated: '2026-08-01'
  source_ids:
  - memharness
  - mind-memory-defense
  - hyset
  - proeval
