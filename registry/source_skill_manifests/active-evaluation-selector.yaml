id: active-evaluation-selector
version: 0.1.0
status: draft
owner: framework owner
category: evaluation
priority: P1
purpose: Choose the most informative evaluation cases under fixed time, compute, or
  review budget.
activation:
  when:
  - model/skill/retrieval/policy/workflow changes need evaluation
  not_when:
  - mandatory certification suite must run fully
inputs:
  required:
  - candidate cases
  - change impact
  - uncertainty
  - failure history
  - risk
  - budget
outputs:
  produces: &id001
  - ranked cases
  - rationale
  - coverage estimate
  - residual risk
effects:
  reads:
  - registry/state/evidence as scoped
  writes:
  - trace and structured result; memory is candidate-only
  network: none by default; adapters declare destinations
  side_effect_class: read_or_control_plane unless composed tool differs
permissions:
- registry:read
- trace:write
dependencies:
- intelligent system evaluation
- impact tracer
- trajectory sentinel
risk:
  tier: R1
  approval: deployment approval; runtime approval follows composed effects
budgets:
  timeout_seconds: 120
  max_retries: 1
  max_tool_calls: 12
idempotency:
  required_for_side_effects: true
postconditions: *id001
memory_policy:
  read: scoped
  write: candidate_only
tests:
- tests/test_cases.yaml
metrics:
- failures per 100
- changed-path coverage
- cost
- missed regressions
provenance:
  generated: '2026-08-01'
  source_ids:
  - proeval
