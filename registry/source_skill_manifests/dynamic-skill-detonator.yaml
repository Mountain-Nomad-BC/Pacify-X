id: dynamic-skill-detonator
version: 0.1.0
status: draft
owner: framework owner
category: security
priority: P0
purpose: Execute a skill in an instrumented sandbox with synthetic secrets and observe
  real behavior.
activation:
  when:
  - skill has code/dynamic instructions/dependencies/external calls
  not_when:
  - environment cannot isolate effects
inputs:
  required:
  - package
  - sandbox policy
  - synthetic secrets
  - network allowlist
  - expected effects
outputs:
  produces: &id001
  - observed behavior
  - data flows
  - effect diff
  - findings
  - artifact log
effects:
  reads:
  - registry/state/evidence as scoped
  writes:
  - trace and structured result; memory is candidate-only
  network: none by default; adapters declare destinations
  side_effect_class: read_or_control_plane unless composed tool differs
permissions:
- registry:read
- trace:write
- sandbox:create
- synthetic-secrets:read
- network-policy:enforce
dependencies:
- skill admission
- container sandbox
- security evidence
risk:
  tier: R3
  approval: security owner approval
budgets:
  timeout_seconds: 120
  max_retries: 1
  max_tool_calls: 12
idempotency:
  required_for_side_effects: true
postconditions: *id001
memory_policy:
  read: scoped
  write: candidate_only
tests:
- tests/test_cases.yaml
metrics:
- undeclared effects
- escape attempts
- coverage
provenance:
  generated: '2026-08-01'
  source_ids:
  - skill-detonate
  - malicious-skills
