id: trace-to-skill-compiler
version: 0.1.0
status: draft
owner: framework owner
category: improvement
priority: P2
purpose: Convert repeated verified trajectories into candidate governed skill packages.
activation:
  when:
  - stable repeated procedure has success and failure examples
  not_when:
  - outcomes unverified
  - hidden human judgment not represented
inputs:
  required:
  - traces
  - outcomes
  - evidence
  - failures
  - domain variables
  - existing skills
outputs:
  produces: &id001
  - draft SKILL.md
  - manifest
  - conditions
  - tests
  - limitations
effects:
  reads:
  - registry/state/evidence as scoped
  writes:
  - trace and structured result; memory is candidate-only
  network: none by default; adapters declare destinations
  side_effect_class: read_or_control_plane unless composed tool differs
permissions:
- registry:read
- trace:write
dependencies:
- procedural compiler
- skill admission
- research translator
risk:
  tier: R1
  approval: deployment approval; runtime approval follows composed effects
budgets:
  timeout_seconds: 120
  max_retries: 1
  max_tool_calls: 12
idempotency:
  required_for_side_effects: true
postconditions: *id001
memory_policy:
  read: scoped
  write: candidate_only
tests:
- tests/test_cases.yaml
metrics:
- accepted drafts
- regression success
- duplicates avoided
provenance:
  generated: '2026-08-01'
  source_ids:
  - procmem
