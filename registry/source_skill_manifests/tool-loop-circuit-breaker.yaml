id: tool-loop-circuit-breaker
version: 0.1.0
status: draft
owner: framework owner
category: security
priority: P0
purpose: Detect cyclic tool calls, repeated no-op state, and cost amplification, then
  stop or isolate.
activation:
  when:
  - agent executes multiple tools/retries
  not_when:
  - bounded polling loop stays within declared policy
inputs:
  required:
  - tool sequence
  - arguments
  - results
  - state hashes
  - cost
  - loop policy
outputs:
  produces: &id001
  - continue/open/review
  - cycle signature
  - waste estimate
  - recovery state
effects:
  reads:
  - registry/state/evidence as scoped
  writes:
  - trace and structured result; memory is candidate-only
  network: none by default; adapters declare destinations
  side_effect_class: read_or_control_plane unless composed tool differs
permissions:
- registry:read
- trace:write
dependencies:
- utility controller
- tool gateway
- budget controller
risk:
  tier: R2
  approval: deployment approval; runtime approval follows composed effects
budgets:
  timeout_seconds: 120
  max_retries: 1
  max_tool_calls: 12
idempotency:
  required_for_side_effects: true
postconditions: *id001
memory_policy:
  read: scoped
  write: candidate_only
tests:
- tests/test_cases.yaml
metrics:
- loops stopped
- cost saved
- false opens
provenance:
  generated: '2026-08-01'
  source_ids:
  - tool-loop-attacks
  - overthinking
