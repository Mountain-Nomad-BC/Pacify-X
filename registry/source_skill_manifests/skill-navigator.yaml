id: skill-navigator
version: 0.1.0
status: draft
owner: framework owner
category: orchestration
priority: P0
purpose: Progressively locate the smallest relevant capability branch without loading
  the full catalog.
activation:
  when:
  - goal maps to multiple domains
  - registry exceeds context budget
  - aliases or product taxonomy must be resolved
  not_when:
  - exact approved skill ID/version is supplied
  - caller cannot enumerate the branch
inputs:
  required:
  - goal
  - identity/scope
  - capability index
  - taxonomy aliases
  - prior failures
outputs:
  produces: &id001
  - ranked path
  - candidate skills
  - missing information
  - retrieval trace
effects:
  reads:
  - registry/state/evidence as scoped
  writes:
  - trace and structured result; memory is candidate-only
  network: none by default; adapters declare destinations
  side_effect_class: read_or_control_plane unless composed tool differs
permissions:
- registry:read
- trace:write
dependencies:
- intelligent system registry
- planner
- taxonomy/navigation
- Corpus2Skill tree
risk:
  tier: R2
  approval: deployment approval; runtime approval follows composed effects
budgets:
  timeout_seconds: 120
  max_retries: 1
  max_tool_calls: 12
idempotency:
  required_for_side_effects: true
postconditions: *id001
memory_policy:
  read: scoped
  write: candidate_only
tests:
- tests/test_cases.yaml
metrics:
- candidate recall
- context loaded
- selection support
- unauthorized discovery
provenance:
  generated: '2026-08-01'
  source_ids:
  - harness-handbook
  - corpus2skill
