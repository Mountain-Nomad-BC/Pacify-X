id: trajectory-failure-sentinel
version: 0.1.0
status: draft
owner: framework owner
category: evaluation
priority: P1
purpose: Detect failure onset early enough to recover before cost or state damage
  accumulates.
activation:
  when:
  - multi-step agent/pipeline active
  not_when:
  - single deterministic step
inputs:
  required:
  - plan
  - step events
  - tool results
  - state changes
  - hypotheses
  - cost
  - failure signatures
outputs:
  produces: &id001
  - trajectory health
  - onset step
  - failure class
  - recovery recommendation
  - basis
effects:
  reads:
  - registry/state/evidence as scoped
  writes:
  - trace and structured result; memory is candidate-only
  network: none by default; adapters declare destinations
  side_effect_class: read_or_control_plane unless composed tool differs
permissions:
- registry:read
- trace:write
dependencies:
- turn orchestrator
- progress ledger
- recovery
risk:
  tier: R1
  approval: deployment approval; runtime approval follows composed effects
budgets:
  timeout_seconds: 120
  max_retries: 1
  max_tool_calls: 12
idempotency:
  required_for_side_effects: true
postconditions: *id001
memory_policy:
  read: scoped
  write: candidate_only
tests:
- tests/test_cases.yaml
metrics:
- lead time
- early recovery
- false intervention
provenance:
  generated: '2026-08-01'
  source_ids:
  - failure-process
