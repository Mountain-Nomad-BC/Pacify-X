id: provenance-signature-verifier
version: 0.1.0
status: draft
owner: framework owner
category: security
priority: P0
purpose: Verify package identity, source, signature, hash, build chain, and owner.
activation:
  when:
  - skill/model adapter/workflow/policy loads
  not_when:
  - never bypass production
inputs:
  required:
  - package
  - signature
  - hash
  - source metadata
  - trusted keys
  - attestation
outputs:
  produces: &id001
  - verified/unverified
  - owner
  - integrity findings
  - trust level
effects:
  reads:
  - registry/state/evidence as scoped
  writes:
  - trace and structured result; memory is candidate-only
  network: none by default; adapters declare destinations
  side_effect_class: read_or_control_plane unless composed tool differs
permissions:
- registry:read
- trace:write
dependencies:
- registry
- admission
- deployment
risk:
  tier: R2
  approval: deployment approval; runtime approval follows composed effects
budgets:
  timeout_seconds: 120
  max_retries: 1
  max_tool_calls: 12
idempotency:
  required_for_side_effects: true
postconditions: *id001
memory_policy:
  read: scoped
  write: candidate_only
tests:
- tests/test_cases.yaml
metrics:
- unverified blocks
- hash mismatches
provenance:
  generated: '2026-08-01'
  source_ids:
  - malicious-skills
