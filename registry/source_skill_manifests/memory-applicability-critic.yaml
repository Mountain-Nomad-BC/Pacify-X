id: memory-applicability-critic
version: 0.1.0
status: draft
owner: framework owner
category: memory
priority: P0
purpose: Determine which parts of a retrieved case apply now and which must be rejected.
activation:
  when:
  - episodic/procedural memory retrieved
  - prior case seems similar
  not_when:
  - item is current immutable evidence or approved policy
inputs:
  required:
  - current context
  - memory
  - scope metadata
  - model/firmware/time variables
  - evidence quality
outputs:
  produces: &id001
  - matching conditions
  - mismatches
  - missing information
  - reusable principles
  - prohibited replay
effects:
  reads:
  - registry/state/evidence as scoped
  writes:
  - trace and structured result; memory is candidate-only
  network: none by default; adapters declare destinations
  side_effect_class: read_or_control_plane unless composed tool differs
permissions:
- registry:read
- trace:write
dependencies:
- intelligent system memory
- experience reconstructor
- diagnostic planner
risk:
  tier: R2
  approval: deployment approval; runtime approval follows composed effects
budgets:
  timeout_seconds: 120
  max_retries: 1
  max_tool_calls: 12
idempotency:
  required_for_side_effects: true
postconditions: *id001
memory_policy:
  read: scoped
  write: candidate_only
tests:
- tests/test_cases.yaml
metrics:
- negative transfer
- rejection precision
- human corrections
provenance:
  generated: '2026-08-01'
  source_ids:
  - memharness
