id: read-only-speculation-controller
version: 0.1.0
status: draft
owner: framework owner
category: advanced
priority: P3
purpose: Predict and prefetch likely next read-only tool results into a quarantined
  cache.
activation:
  when:
  - next read predictable
  - call read-only/cacheable/low sensitivity/bounded cost
  not_when:
  - state-changing/approval/secrets/broad sensitive read
  - low expected value
inputs:
  required:
  - partial trajectory
  - candidate tools
  - predictor
  - cost/sensitivity
outputs:
  produces: &id001
  - prefetch decision
  - quarantined result
  - waste record
  - match event
effects:
  reads:
  - registry/state/evidence as scoped
  writes:
  - trace and structured result; memory is candidate-only
  network: none by default; adapters declare destinations
  side_effect_class: read_only_speculative
permissions:
- registry:read
- trace:write
dependencies:
- tool gateway
- cache
- budget controller
risk:
  tier: R2
  approval: experimental feature flag
budgets:
  timeout_seconds: 120
  max_retries: 1
  max_tool_calls: 12
idempotency:
  required_for_side_effects: true
postconditions: *id001
memory_policy:
  read: scoped
  write: candidate_only
tests:
- tests/test_cases.yaml
metrics:
- latency saved
- hit rate
- waste cost
- data volume
provenance:
  generated: '2026-08-01'
  source_ids:
  - speculate-while-reason
