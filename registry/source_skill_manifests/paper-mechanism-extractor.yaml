id: paper-mechanism-extractor
version: 0.1.0
status: draft
owner: framework owner
category: research-ops
priority: P1
purpose: Extract the actual mechanism, assumptions, data, evidence, and limitations
  from a paper.
activation:
  when:
  - new paper considered
  not_when:
  - primary source is available but only summary was read
inputs:
  required:
  - paper
  - supplement
  - code
  - claims
  - related work
outputs:
  produces: &id001
  - mechanism card
  - claim/evidence map
  - assumptions
  - limitations
  - reproduction requirements
effects:
  reads:
  - registry/state/evidence as scoped
  writes:
  - trace and structured result; memory is candidate-only
  network: none by default; adapters declare destinations
  side_effect_class: read_or_control_plane unless composed tool differs
permissions:
- registry:read
- trace:write
dependencies:
- research registry
- gap analyzer
risk:
  tier: R1
  approval: deployment approval; runtime approval follows composed effects
budgets:
  timeout_seconds: 120
  max_retries: 1
  max_tool_calls: 12
idempotency:
  required_for_side_effects: true
postconditions: *id001
memory_policy:
  read: scoped
  write: candidate_only
tests:
- tests/test_cases.yaml
metrics:
- claim accuracy
- missing assumptions
provenance:
  generated: '2026-08-01'
  source_ids:
  - arxiv-cs-ai-recent
  - voltagent-agent-papers
