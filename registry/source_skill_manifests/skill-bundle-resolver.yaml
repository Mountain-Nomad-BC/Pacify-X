id: skill-bundle-resolver
version: 0.1.0
status: draft
owner: framework owner
category: orchestration
priority: P1
purpose: Select a compatible set of skills and tools that jointly satisfies all required
  outcomes.
activation:
  when:
  - task needs multiple capabilities
  - one skill cannot satisfy all postconditions
  - co-execution data exists
  not_when:
  - single deterministic tool call
  - required capabilities have incompatible effects
inputs:
  required:
  - candidate skills
  - required capability slots
  - dependency graph
  - co-execution graph
  - risk/cost/latency limits
outputs:
  produces: &id001
  - ranked bundles
  - execution order
  - compatibility warnings
  - fallback bundle
effects:
  reads:
  - registry/state/evidence as scoped
  writes:
  - trace and structured result; memory is candidate-only
  network: none by default; adapters declare destinations
  side_effect_class: read_or_control_plane unless composed tool differs
permissions:
- registry:read
- trace:write
dependencies:
- skill registry
- coexecution graph
- planner
- framework policy
risk:
  tier: R1
  approval: deployment approval; runtime approval follows composed effects
budgets:
  timeout_seconds: 120
  max_retries: 1
  max_tool_calls: 12
idempotency:
  required_for_side_effects: true
postconditions: *id001
memory_policy:
  read: scoped
  write: candidate_only
tests:
- tests/test_cases.yaml
metrics:
- complete-bundle rate
- missing-tool failures
- unnecessary skills
- cost per verified outcome
provenance:
  generated: '2026-08-01'
  source_ids:
  - hyset
