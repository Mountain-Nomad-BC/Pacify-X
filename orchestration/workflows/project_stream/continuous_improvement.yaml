orchestration_id: continuous_improvement
title: Find measured opportunities and govern new skill creation
version: 0.2.0
status: design-ready
trigger: explicit-or-policy-scheduled
project_binding: required unless workspace bootstrap
skills:
- skill-health-entropy
- pattern-miner
- opportunity-miner
- capability-gap-skill-foundry
- framework-dna
- decision-graph
required_context:
- workspace_id
- agent_id
- session_id
- intent_id
- correlation_id
preflight:
- constitution_resolved
- lease_valid
- scope_resolved
- side_effect_budget_set
- evaluator_identity_frozen
- acceptance_policy_frozen
- development_holdout_split_frozen
learning_boundaries:
