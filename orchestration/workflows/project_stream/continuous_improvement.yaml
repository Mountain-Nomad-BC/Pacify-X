  independent_verification_required: true
  negative_results_retained: true
  shared_contribution_is_authority: false
  direct_learning_write_allowed: false
terminal_evidence:
- final_evidence_sha256
- evaluator_sha256
- acceptance_policy_sha256
- holdout_case_set_sha256
- verification_record_sha256
outcomes:
- improvement_backlog
- verified_contribution_candidate
failure_policy: checkpoint-and-fail-closed-on-boundary-or-integrity-violation
audit: true
