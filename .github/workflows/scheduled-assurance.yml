name: Scheduled and manual assurance

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-assurance
  cancel-in-progress: false

jobs:
  exhaustive-platform-release-environment:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONNOUSERSITE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - name: Install validation toolchain
        run: python -m pip install --require-hashes -r requirements-release.txt
      - name: Install and test exact extension dependencies
        working-directory: extension
        run: npm ci --ignore-scripts && npm test
      - name: Refresh affected section receipts
        run: |
          python -m runtime.cli --root . test-section run testing-governance
          python -m runtime.cli --root . test-section run dashboard-extension
          python -m runtime.cli --root . test-section run studio-memory-graph
          python -m runtime.cli --root . test-section run learning-promotion
          python -m runtime.cli --root . test-section run execution-placement
          python -m runtime.cli --root . test-section run hardware-routing
      - name: Refresh stale test groups with governed parallel lanes
        run: python -m runtime.cli --root . test-group run-stale --workers 3
      - name: Full source profile
        run: python -m runtime.cli --root . test-profile run full
      - name: Negative and deterministic exact-tool certification
        run: python -m runtime.cli --root . tools certify
      - name: Security, sanitation, scanner, and portability controls
        run: python -m pytest -q -p no:cacheprovider tests/test_sanitization_audit.py tests/test_sanitation_assurance.py tests/test_tool_intake.py tests/test_evidence_portability.py
      - name: Clean-clone installed artifact exercise
        run: python -m pytest -q -p no:cacheprovider tests/test_installed_wheel_e2e.py
      - name: Final structural and release-state audit
        run: |
          python -m runtime.cli --root . audit structure
          python -m runtime.cli --root . audit release --strict-external-evidence
