name: PACIFY-X CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  platform-matrix:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install test surface
        run: |
          python -m pip install --require-hashes -r requirements-release.lock
          python -m pip install --no-build-isolation .
      - name: Platform path, lock, permission, and line-ending controls
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONNOUSERSITE: "1"
        run: python -m pytest -q -p no:cacheprovider tests/test_platform_support.py tests/test_bounded_walk.py tests/test_file_lock_contention.py tests/test_evidence_portability.py

  assurance-gates:
    name: assurance / ${{ matrix.gate }}
    strategy:
      fail-fast: false
      matrix:
        gate: [contracts, dependencies, platform, generated, registry, licensing, structural]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONNOUSERSITE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
      - name: Install exact validation tools
        run: python -m pip install --require-hashes -r requirements-release.lock
      - name: Run independently receipted gate
        run: python -m runtime.cli --root . gates run --gate ${{ matrix.gate }} --receipt-dir "${{ runner.temp }}/gate-receipts"
      - name: Retain gate receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: assurance-gate-${{ matrix.gate }}
          path: ${{ runner.temp }}/gate-receipts/
          if-no-files-found: error

  governed-gates:
    needs: assurance-gates
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONNOUSERSITE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
      - name: Install exact validation tools
        run: python -m pip install --require-hashes -r requirements-release.lock
      - name: Package metadata and version policy
        run: python -m pytest -q -p no:cacheprovider tests/test_platform_support.py tests/test_release_identity_controls.py
      - name: Fast correctness profile
        run: python -m runtime.cli --root . test-profile run fast
      - name: Executed critical branch coverage with dynamic contexts
        shell: bash
        run: |
          export COVERAGE_FILE="$RUNNER_TEMP/pacify-x-coverage.data"
          python -m coverage run --rcfile=.coveragerc -m pytest -q -p no:cacheprovider \
            tests/test_release_identity_controls.py tests/test_release_distribution_controls.py \
            tests/test_release_certification.py tests/test_bounded_walk.py tests/test_project_onboarding.py \
            tests/test_project_control_plane.py tests/test_recovery.py \
            tests/test_contract_runtime.py tests/test_memory_integrity_controls.py tests/test_memory_vault.py \
            tests/test_workspace_manager.py tests/test_event_ledger_integrity.py tests/test_admission_controller.py \
            tests/test_execution_contract.py tests/test_effect_grants.py
          python -m coverage json --rcfile=.coveragerc --show-contexts -o "$RUNNER_TEMP/coverage.json"
          python -c "from pathlib import Path; from runtime.coverage_assurance import validate_coverage_evidence; r=validate_coverage_evidence(Path('.'),Path('$RUNNER_TEMP/coverage.json')); print(r); raise SystemExit(0 if r['valid'] else 1)"
      - name: Generate package manifest
        shell: bash
        run: |
          python -c "from pathlib import Path; import json; from runtime.release_distribution import generate_artifact_manifest; r=generate_artifact_manifest(Path('.')); Path('$RUNNER_TEMP/artifact-manifest.json').write_text(json.dumps(r,indent=2)+'\n'); print({'valid':r['valid'],'records':len(r['records'])}); raise SystemExit(0 if r['valid'] else 1)"
      - name: Build wheel and sdist once
        run: python -m build --no-isolation --wheel --sdist --outdir dist
      - name: Inspect exact package contents against generated manifest
        shell: bash
        run: |
          python -c "from pathlib import Path; from runtime.release_distribution import bind_artifact_set,file_record; from runtime.release_identity import authoritative_version; d=Path('dist'); records=[file_record(next(d.glob('*.whl')),'wheel'),file_record(next(d.glob('*.tar.gz')),'sdist')]; r=bind_artifact_set(d,records,source_product_digest='ci-observed-source',version=authoritative_version(Path('.')),source_root=Path('.')); print(r); raise SystemExit(0 if r['valid'] else 1)"
      - name: Upload coverage and package evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: governed-gate-evidence
          path: |
            ${{ runner.temp }}/coverage.json
            ${{ runner.temp }}/artifact-manifest.json
            dist/
          if-no-files-found: warn
