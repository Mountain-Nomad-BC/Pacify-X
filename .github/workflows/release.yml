name: Exact signed release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing annotated release tag to certify and publish
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: pacify-x-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  certify-and-publish:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONNOUSERSITE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PACIFY_X_RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - name: Checkout exact annotated tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Set up tested release Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Set up tested extension Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Require annotated tag and clean source
        shell: pwsh
        run: |
          if ($env:PACIFY_X_RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') { throw "release tag is malformed" }
          git fetch --force origin "refs/tags/$($env:PACIFY_X_RELEASE_TAG):refs/tags/$($env:PACIFY_X_RELEASE_TAG)"
          if ((git cat-file -t $env:PACIFY_X_RELEASE_TAG) -ne "tag") { throw "release tag must be annotated" }
          if ((git rev-list -n 1 $env:PACIFY_X_RELEASE_TAG) -ne (git rev-parse HEAD)) { throw "release tag does not point to checked-out HEAD" }
          if (git status --porcelain=v1 --untracked-files=all) { throw "release checkout is not clean" }

      - name: Prepare hash-locked wheelhouse
        shell: pwsh
        run: |
          $wheelhouse = Join-Path $env:RUNNER_TEMP "pacify-x-release-wheelhouse"
          $artifactDir = Join-Path $env:RUNNER_TEMP "pacify-x-release-artifacts"
          New-Item -ItemType Directory -Path $wheelhouse | Out-Null
          New-Item -ItemType Directory -Path $artifactDir | Out-Null
          python -m pip download --require-hashes -r requirements-release.txt -d $wheelhouse
          "PACIFY_X_RELEASE_WHEELHOUSE=$wheelhouse" | Out-File -FilePath $env:GITHUB_ENV -Append
          "PACIFY_X_RELEASE_ARTIFACT_DIR=$artifactDir" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Materialize protected publisher key
        shell: pwsh
        env:
          RELEASE_KEY_B64: ${{ secrets.PACIFY_X_RELEASE_SIGNING_KEY_B64 }}
        run: |
          if (-not $env:RELEASE_KEY_B64) { throw "PACIFY_X_RELEASE_SIGNING_KEY_B64 is required" }
          $keyPath = Join-Path $PWD ".git\pacify-x-release-key"
          [IO.File]::WriteAllBytes($keyPath, [Convert]::FromBase64String($env:RELEASE_KEY_B64))
          & icacls $keyPath /inheritance:r /grant:r "${env:USERNAME}:(R,W)" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "release private key permission hardening failed" }
          $publicKey = (& ssh-keygen -y -f $keyPath)
          if ($LASTEXITCODE -ne 0 -or -not $publicKey) { throw "release public key derivation failed" }
          [IO.File]::WriteAllText("${keyPath}.pub", "$publicKey`n", [Text.Encoding]::ASCII)
          $fingerprintFields = (& ssh-keygen -lf "${keyPath}.pub" -E sha256) -split '\s+'
          if ($LASTEXITCODE -ne 0 -or $fingerprintFields.Count -lt 2) { throw "release public key validation failed" }
          $trustedFingerprints = @((Get-Content policies/release-trust.json -Raw | ConvertFrom-Json).trusted_signers | ForEach-Object { $_.fingerprint })
          if ($trustedFingerprints -notcontains $fingerprintFields[1]) { throw "release signing key is not trusted by repository policy" }
          "PACIFY_X_RELEASE_SIGNING_KEY=$keyPath" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Run one-build certification against exact artifacts
        shell: pwsh
        run: |
          $resultPath = Join-Path $env:RUNNER_TEMP "pacify-x-release-result.json"
          python -m runtime.cli --root . release finalize `
            --release $env:PACIFY_X_RELEASE_TAG.Substring(1) `
            --artifact-dir $env:PACIFY_X_RELEASE_ARTIFACT_DIR `
            --wheelhouse $env:PACIFY_X_RELEASE_WHEELHOUSE `
            --signing-key $env:PACIFY_X_RELEASE_SIGNING_KEY | Tee-Object $resultPath
          $result = Get-Content $resultPath -Raw | ConvertFrom-Json
          if (-not $result.valid -or -not $result.certified) { throw "release certification failed" }
          "PACIFY_X_RUN_ID=$($result.run_id)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "PACIFY_X_RELEASE=$($env:PACIFY_X_RELEASE_TAG.Substring(1))" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Independently verify exact staged bytes
        shell: pwsh
        run: |
          $verificationPath = Join-Path $env:RUNNER_TEMP "pacify-x-release-verification.json"
          python -m runtime.cli --root . release verify --release $env:PACIFY_X_RELEASE --artifact-dir $env:PACIFY_X_RELEASE_ARTIFACT_DIR | Tee-Object $verificationPath
          $result = Get-Content $verificationPath -Raw | ConvertFrom-Json
          if (-not $result.valid) { throw "independent release verification failed" }

      - name: Build and exercise the exact VSIX without rebuilding it
        shell: pwsh
        run: |
          npm ci --ignore-scripts --prefix extension
          npm run package --prefix extension
          $package = Get-Content extension/package.json -Raw | ConvertFrom-Json
          $vsix = (Resolve-Path "extension/dist/$($package.name)-$($package.version).vsix").Path
          $sha = (Get-FileHash -LiteralPath $vsix -Algorithm SHA256).Hash.ToLowerInvariant()
          node extension/scripts/run-installed-vsix-smoke.js --engine-root $PWD --vsix $vsix --expected-sha256 $sha
          if ((Get-FileHash -LiteralPath $vsix -Algorithm SHA256).Hash.ToLowerInvariant() -ne $sha) { throw "VSIX changed during installed-host certification" }
          "PACIFY_X_CERTIFIED_VSIX=$vsix" | Out-File -FilePath $env:GITHUB_ENV -Append
          "PACIFY_X_CERTIFIED_VSIX_SHA256=$sha" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Assemble immutable release assets without rebuilding
        shell: pwsh
        run: |
          $run = "evidence\releases\$env:PACIFY_X_RELEASE\$env:PACIFY_X_RUN_ID"
          New-Item -ItemType Directory -Path release-assets | Out-Null
          Copy-Item "$env:PACIFY_X_RELEASE_ARTIFACT_DIR\*" release-assets\
          Copy-Item "$run\SHA256SUMS.txt" release-assets\
          Copy-Item "$run\sbom.cdx.json" release-assets\
          Copy-Item "$run\provenance.intoto.json" release-assets\
          Copy-Item "$run\evidence-manifest.json" release-assets\
          Copy-Item "evidence\releases\$env:PACIFY_X_RELEASE\certificate.json" release-assets\
          Copy-Item "evidence\releases\$env:PACIFY_X_RELEASE\certificate.json.sig" release-assets\
          Copy-Item $env:PACIFY_X_CERTIFIED_VSIX release-assets\
          Copy-Item extension/evidence/installed-vsix-smoke.json release-assets\installed-vsix-smoke.json
          if (Test-Path "evidence\release-revocation-$env:PACIFY_X_RELEASE.json") {
            Copy-Item "evidence\release-revocation-$env:PACIFY_X_RELEASE.json" release-assets\
          }
          @"
          PACIFY-X $env:PACIFY_X_RELEASE

          Self-certified release; signed evidence and reproducible verification included.
          These are the exact artifacts built, tested, inspected, signed, and verified by this run. No release asset was rebuilt after certification.
          "@ | Set-Content release-notes.md

      - name: Package durable complete evidence custody
        shell: pwsh
        run: |
          $run = "evidence\releases\$env:PACIFY_X_RELEASE\$env:PACIFY_X_RUN_ID"
          $custodyWork = Join-Path $env:RUNNER_TEMP "pacify-x-evidence-custody"
          $commit = git rev-parse HEAD
          python scripts/package_release_evidence.py `
            --input $run `
            --input "$env:RUNNER_TEMP\pacify-x-release-result.json" `
            --input "$env:RUNNER_TEMP\pacify-x-release-verification.json" `
            --input $env:PACIFY_X_RELEASE_ARTIFACT_DIR `
            --release $env:PACIFY_X_RELEASE `
            --source-commit $commit `
            --certificate "evidence\releases\$env:PACIFY_X_RELEASE\certificate.json" `
            --output release-assets `
            --work-dir $custodyWork `
            --locator-base "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:PACIFY_X_RELEASE_TAG" `
            --signing-key $env:PACIFY_X_RELEASE_SIGNING_KEY

      - name: Publish exact GitHub Release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:PACIFY_X_RELEASE_TAG release-assets\* --verify-tag --title "PACIFY-X $env:PACIFY_X_RELEASE" --notes-file release-notes.md

      - name: Retain certification evidence on failure or success
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pacify-x-release-${{ env.PACIFY_X_RELEASE_TAG }}
          path: |
            ${{ runner.temp }}/pacify-x-release-result.json
            ${{ runner.temp }}/pacify-x-release-verification.json
            ${{ runner.temp }}/pacify-x-release-artifacts/
            release-assets/
            evidence/releases/
            ${{ runner.temp }}/pacify-x-release-quarantine/**/release-evidence/
          if-no-files-found: warn
          retention-days: 90
