name: Publish exact certified release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing annotated tag with a pre-staged signed draft release
        required: true
        type: string

permissions: {}

concurrency:
  group: pacify-x-release-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  verify-certified-draft:
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      release: ${{ steps.verify.outputs.release }}
      vsix_name: ${{ steps.verify.outputs.vsix_name }}
      vsix_sha256: ${{ steps.verify.outputs.vsix_sha256 }}
      vsix_size: ${{ steps.verify.outputs.vsix_size }}
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONNOUSERSITE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PACIFY_X_RELEASE_TAG: ${{ inputs.release_tag }}
      PACIFY_X_VSIX_NAME: pacify-x-vscode-0.6.85.vsix
      PACIFY_X_VSIX_SHA256: dae75fa9ecd4084ff85353ff404b6b1b9c87df146b763bae6f64006deeb04cd3
      PACIFY_X_VSIX_SIZE: "4267484"
      PACIFY_X_CANDIDATE_ID: pacify-x-certification-20260906-final102-single
    steps:
      - name: Checkout exact annotated tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_tag }}

      - name: Set up verification Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Set up installed-host Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Require exact tag and existing release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:PACIFY_X_RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') { throw "release tag is malformed" }
          if ((git cat-file -t $env:PACIFY_X_RELEASE_TAG) -ne "tag") { throw "release tag must be annotated" }
          if ((git rev-list -n 1 $env:PACIFY_X_RELEASE_TAG) -ne (git rev-parse HEAD)) { throw "release tag does not point to checked-out HEAD" }
          if (git status --porcelain=v1 --untracked-files=all) { throw "release checkout is not clean" }
          $remote = gh release view $env:PACIFY_X_RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json tagName,isDraft,isPrerelease | ConvertFrom-Json
          if ($remote.tagName -ne $env:PACIFY_X_RELEASE_TAG -or $remote.isPrerelease) { throw "remote release identity is invalid" }

      - name: Install hash-locked verification dependencies
        shell: pwsh
        run: python -m pip install --require-hashes -r requirements-release.txt

      - name: Download and authenticate the certified draft
        id: verify
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = Join-Path $env:RUNNER_TEMP "pacify-x-release-assets"
          $restored = Join-Path $env:RUNNER_TEMP "pacify-x-restored-custody"
          $resultPath = Join-Path $env:RUNNER_TEMP "pacify-x-publication-verification.json"
          gh release download $env:PACIFY_X_RELEASE_TAG --repo $env:GITHUB_REPOSITORY --dir $assets
          if ($LASTEXITCODE -ne 0) { throw "release asset download failed" }
          $release = $env:PACIFY_X_RELEASE_TAG.Substring(1)
          $commit = git rev-parse HEAD
          python -B scripts/verify_release_publication.py `
            --assets $assets `
            --output $restored `
            --repository . `
            --release $release `
            --source-commit $commit `
            --candidate-id $env:PACIFY_X_CANDIDATE_ID `
            --vsix-name $env:PACIFY_X_VSIX_NAME `
            --vsix-sha256 $env:PACIFY_X_VSIX_SHA256 `
            --vsix-size $env:PACIFY_X_VSIX_SIZE `
            --replace-release-evidence | Tee-Object $resultPath
          if ($LASTEXITCODE -ne 0) { throw "signed publication custody verification failed" }
          $result = Get-Content $resultPath -Raw | ConvertFrom-Json
          if (-not $result.valid) { throw "signed publication custody is not valid" }
          python -B -m runtime.cli --root . release verify --release $release --artifact-dir $result.artifact_dir
          if ($LASTEXITCODE -ne 0) { throw "independent release verification failed" }
          npm ci --ignore-scripts --prefix extension
          node extension/scripts/run-installed-vsix-smoke.js `
            --engine-root . `
            --vsix $result.vsix `
            --expected-sha256 $env:PACIFY_X_VSIX_SHA256 `
            --receipt (Join-Path $env:RUNNER_TEMP "publication-installed-smoke.json") `
            --lifecycle-receipt (Join-Path $env:RUNNER_TEMP "publication-installed-lifecycle.json")
          if ($LASTEXITCODE -ne 0) { throw "publication VSIX smoke failed" }
          $after = (Get-FileHash -LiteralPath $result.vsix -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($after -ne $env:PACIFY_X_VSIX_SHA256 -or (Get-Item -LiteralPath $result.vsix).Length -ne [int64]$env:PACIFY_X_VSIX_SIZE) { throw "verified VSIX bytes changed" }
          "release=$release" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "vsix_name=$env:PACIFY_X_VSIX_NAME" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "vsix_sha256=$env:PACIFY_X_VSIX_SHA256" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "vsix_size=$env:PACIFY_X_VSIX_SIZE" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Retain verification receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pacify-x-publication-verification-${{ inputs.release_tag }}
          path: |
            ${{ runner.temp }}/pacify-x-publication-verification.json
            ${{ runner.temp }}/publication-installed-smoke.json
            ${{ runner.temp }}/publication-installed-lifecycle.json
          if-no-files-found: warn
          retention-days: 90

  publish-marketplace:
    needs: verify-certified-draft
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download the exact verified VSIX
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $target = Join-Path $env:RUNNER_TEMP "marketplace"
          gh release download "${{ inputs.release_tag }}" --repo $env:GITHUB_REPOSITORY --pattern "${{ needs.verify-certified-draft.outputs.vsix_name }}" --dir $target
          if ($LASTEXITCODE -ne 0) { throw "verified VSIX download failed" }
          $vsix = Join-Path $target "${{ needs.verify-certified-draft.outputs.vsix_name }}"
          $sha = (Get-FileHash -LiteralPath $vsix -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sha -ne "${{ needs.verify-certified-draft.outputs.vsix_sha256 }}" -or (Get-Item -LiteralPath $vsix).Length -ne [int64]"${{ needs.verify-certified-draft.outputs.vsix_size }}") { throw "Marketplace input differs from signed VSIX" }
          npx --yes @vscode/vsce@3.9.2 publish --oidc --skip-duplicate --packagePath $vsix
          if ($LASTEXITCODE -ne 0) { throw "Marketplace OIDC publication failed" }
          $after = (Get-FileHash -LiteralPath $vsix -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($after -ne $sha -or (Get-Item -LiteralPath $vsix).Length -ne [int64]"${{ needs.verify-certified-draft.outputs.vsix_size }}") { throw "VSIX bytes changed during Marketplace publication" }

  publish-github:
    needs: [verify-certified-draft, publish-marketplace]
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Reverify bytes and make the existing release public
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $target = Join-Path $env:RUNNER_TEMP "github-release"
          gh release download "${{ inputs.release_tag }}" --repo $env:GITHUB_REPOSITORY --pattern "${{ needs.verify-certified-draft.outputs.vsix_name }}" --dir $target
          if ($LASTEXITCODE -ne 0) { throw "verified VSIX redownload failed" }
          $vsix = Join-Path $target "${{ needs.verify-certified-draft.outputs.vsix_name }}"
          $sha = (Get-FileHash -LiteralPath $vsix -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sha -ne "${{ needs.verify-certified-draft.outputs.vsix_sha256 }}" -or (Get-Item -LiteralPath $vsix).Length -ne [int64]"${{ needs.verify-certified-draft.outputs.vsix_size }}") { throw "GitHub publication input differs from signed VSIX" }
          $release = gh release view "${{ inputs.release_tag }}" --repo $env:GITHUB_REPOSITORY --json isDraft,isPrerelease | ConvertFrom-Json
          if ($release.isPrerelease) { throw "prerelease state is not admitted" }
          if ($release.isDraft) {
            gh release edit "${{ inputs.release_tag }}" --repo $env:GITHUB_REPOSITORY --draft=false
            if ($LASTEXITCODE -ne 0) { throw "GitHub release publication failed" }
          }
          $final = gh release view "${{ inputs.release_tag }}" --repo $env:GITHUB_REPOSITORY --json isDraft | ConvertFrom-Json
          if ($final.isDraft) { throw "GitHub release remains a draft" }
