[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "engineering-loop-bootstrap"
version = "0.7.0.dev0"
description = "PACIFY-X governed engineering framework and engineering-bootstrap control plane"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Ben J. Cikovic"}]
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
]

[project.urls]
Homepage = "https://github.com/Mountain-Nomad-BC/Pacify-X"
Repository = "https://github.com/Mountain-Nomad-BC/Pacify-X"
Issues = "https://github.com/Mountain-Nomad-BC/Pacify-X/issues"

[project.optional-dependencies]
test = ["pytest==9.1.1", "PyYAML==6.0.3"]
build = ["build==1.5.0", "setuptools==84.0.0", "wheel==0.48.0"]
lint = ["ruff==0.16.3"]
release = ["build==1.5.0", "colorama==0.4.6", "coverage==7.15.4", "iniconfig==2.3.0", "packaging==26.3", "pluggy==1.6.0", "Pygments==2.20.0", "pyproject_hooks==1.2.0", "pytest==9.1.1", "PyYAML==6.0.3", "ruff==0.16.3", "setuptools==84.0.0", "wheel==0.48.0"]

[project.scripts]
engineering-bootstrap = "engineering_bootstrap.cli:main"

[tool.ruff]
target-version = "py311"
line-length = 88
exclude = [".px/preserved-skills"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"scripts/archive_committed_wal.py" = ["E402"]
"scripts/build_engine_identity.py" = ["E402"]
"scripts/build_reclamation_learning_promotion.py" = ["E402"]
"scripts/quarantine_paths.py" = ["E402"]

[tool.ruff.format]
line-ending = "lf"

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["Python", ".git", ".venv", "node_modules", "build", "dist"]
tmp_path_retention_count = 0
tmp_path_retention_policy = "none"

[tool.setuptools]
package-dir = {engineering_bootstrap = "runtime", "engineering_bootstrap.builders" = "builders"}
packages = [
  "engineering_bootstrap",
  "engineering_bootstrap.builders",
  "engineering_bootstrap.cognitive_core",
  "engineering_bootstrap.project_reasoning",
  "engineering_bootstrap.metacognitive_evolution",
  "engineering_bootstrap.metacognitive_evolution.agent_profiles",
  "engineering_bootstrap.metacognitive_evolution.capability_genome",
  "engineering_bootstrap.metacognitive_evolution.common",
  "engineering_bootstrap.metacognitive_evolution.engineering_dna",
  "engineering_bootstrap.metacognitive_evolution.introspection",
  "engineering_bootstrap.metacognitive_evolution.knowledge_physics",
  "engineering_bootstrap.metacognitive_evolution.metacognition",
  "engineering_bootstrap.metacognitive_evolution.optimization",
  "engineering_bootstrap.metacognitive_evolution.semantic_contracts",
  "engineering_bootstrap.metacognitive_evolution.theory_induction",
]
include-package-data = false

[tool.setuptools.package-data]
engineering_bootstrap = ["studio_operations.json"]

